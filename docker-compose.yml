version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: card_servicing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicing_admin
      POSTGRES_PASSWORD: servicing_pass_dev
      POSTGRES_DB: card_servicing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicing_admin -d card_servicing"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: card_servicing_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
