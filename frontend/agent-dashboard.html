<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Servicing — Agent Handoff Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --danger: #ff6b6b;
    --success: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }
  .sidebar {
    width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 { font-size: 16px; margin: 0 0 4px; }
  .sidebar-header p { font-size: 12px; color: var(--muted); margin: 0; }
  .case-list { flex: 1; overflow-y: auto; }
  .case-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .case-item:hover { background: #1e222c; }
  .case-item.active { background: #1e2a44; border-left: 3px solid var(--accent); }
  .case-name { font-weight: 600; font-size: 14px; }
  .case-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #3a2020;
    color: var(--danger);
    margin-top: 6px;
  }
  .main { flex: 1; overflow-y: auto; padding: 32px; }
  .empty-state { color: var(--muted); text-align: center; margin-top: 100px; }
  .case-header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
  .case-header h2 { margin: 0 0 8px; }
  .case-header .sub { color: var(--muted); font-size: 14px; }
  .reason-box {
    background: #241a1a;
    border: 1px solid #4a2a2a;
    color: #ff9d9d;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 16px;
    font-size: 14px;
  }
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 28px 0 12px;
  }
  .timeline { border-left: 2px solid var(--border); padding-left: 20px; }
  .event {
    position: relative;
    padding-bottom: 20px;
  }
  .event::before {
    content: "";
    position: absolute;
    left: -26px;
    top: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }
  .event.decision-denied::before { background: var(--danger); }
  .event.decision-approved::before { background: var(--success); }
  .event-head { font-size: 14px; font-weight: 600; }
  .event-actor { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-left: 8px; }
  .event-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .event-detail {
    margin-top: 6px;
    font-size: 12px;
    color: #c3c8d1;
    background: #1b1e26;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
  }
  .hash-note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--success); }
  .dot.bad { background: var(--danger); }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Escalation Queue</h1>
    <p id="queue-count">Loading...</p>
    <button class="refresh-btn" onclick="loadEscalations()" style="margin-top:10px;">Refresh</button>
  </div>
  <div class="case-list" id="case-list"></div>
</div>

<div class="main" id="main">
  <div class="empty-state">Select a case from the queue to view full context.</div>
</div>

<script>
const API_BASE = "http://localhost:8000";
let currentSessionId = null;

async function loadEscalations() {
  const res = await fetch(`${API_BASE}/escalations`);
  const data = await res.json();
  const list = document.getElementById("case-list");
  const count = document.getElementById("queue-count");
  count.textContent = `${data.escalations.length} case(s) awaiting review`;

  if (data.escalations.length === 0) {
    list.innerHTML = `<div style="padding:20px; color:var(--muted); font-size:13px;">No escalations right now.</div>`;
    return;
  }

  list.innerHTML = data.escalations.map(e => `
    <div class="case-item ${e.session_id === currentSessionId ? 'active' : ''}"
         onclick="loadCase('${e.session_id}')">
      <div class="case-name">${e.full_name}</div>
      <div class="case-meta">${e.email}</div>
      <div class="case-meta">${e.request_type || 'unknown request'} · ${new Date(e.escalated_at || e.started_at).toLocaleString()}</div>
      <div class="badge">${e.escalation_reason}</div>
    </div>
  `).join("");
}

async function loadCase(sessionId) {
  currentSessionId = sessionId;
  loadEscalations(); // re-render to highlight active item

  const [auditRes, verifyRes] = await Promise.all([
    fetch(`${API_BASE}/audit/${sessionId}`),
    fetch(`${API_BASE}/audit-verify`)
  ]);
  const audit = await auditRes.json();
  const verify = await verifyRes.json();

  const events = audit.events;
  const escalationEvent = events.find(e => e.event_type === "escalated");
  const firstEvent = events[0];

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="case-header">
      <h2>Session ${sessionId.slice(0, 8)}...</h2>
      <div class="sub">${events.length} logged events · request type: ${events.find(e => e.request_type)?.request_type || 'n/a'}</div>
      ${escalationEvent ? `<div class="reason-box">⚠ Escalated: ${escalationEvent.detail.reason || 'no reason logged'}</div>` : ''}
    </div>

    <div class="section-title">Full Audit Trail (chronological)</div>
    <div class="timeline">
      ${events.map(e => `
        <div class="event decision-${e.decision || ''}">
          <div class="event-head">${e.event_type}${e.decision ? ` — ${e.decision}` : ''}<span class="event-actor">${e.actor}</span></div>
          <div class="event-time">${new Date(e.created_at).toLocaleString()}</div>
          <div class="event-detail">${JSON.stringify(e.detail, null, 2)}</div>
        </div>
      `).join("")}
    </div>

    <div class="hash-note">
      <span class="dot ${verify.intact ? 'ok' : 'bad'}"></span>
      Audit chain ${verify.intact ? 'verified intact' : 'BROKEN — tampering detected'} across all sessions
    </div>
  `;
}

loadEscalations();
setInterval(loadEscalations, 10000); // auto-refresh queue every 10s
</script>

</body>
</html>
