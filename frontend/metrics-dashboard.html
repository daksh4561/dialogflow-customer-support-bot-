<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Servicing — Metrics</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --danger: #ff6b6b;
    --success: #4caf7d;
    --warn: #e0a94c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .card-value { font-size: 32px; font-weight: 700; }
  .card-value.good { color: var(--success); }
  .card-value.bad { color: var(--danger); }
  .card-value.warn { color: var(--warn); }
  .card-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 32px 0 12px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
  }
  .pill.resolved { background: #16261e; color: var(--success); }
  .pill.escalated { background: #2a2016; color: var(--warn); }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<h1>Servicing Agent — Performance Metrics</h1>
<div class="sub">First-contact resolution, audit completeness, and escalation quality — computed live from the audit log.</div>
<button class="refresh-btn" onclick="loadMetrics()">Refresh</button>

<div class="grid" id="top-cards"></div>

<div class="section-title">Breakdown by Request Type</div>
<div id="breakdown-table"></div>

<div class="section-title">Audit Trail Health</div>
<div class="grid" id="audit-cards"></div>

<script>
const API_BASE = "http://localhost:8000";

function pct(x) {
  if (x === null || x === undefined) return "—";
  return (x * 100).toFixed(0) + "%";
}

function scoreClass(x, goodAt = 0.8, warnAt = 0.5) {
  if (x === null || x === undefined) return "";
  if (x >= goodAt) return "good";
  if (x >= warnAt) return "warn";
  return "bad";
}

async function loadMetrics() {
  const res = await fetch(`${API_BASE}/metrics`);
  const m = await res.json();

  document.getElementById("top-cards").innerHTML = `
    <div class="card">
      <div class="card-label">First-Contact Resolution Rate</div>
      <div class="card-value ${scoreClass(m.first_contact_resolution_rate)}">${pct(m.first_contact_resolution_rate)}</div>
      <div class="card-note">${m.session_outcomes.resolved} resolved / ${m.session_outcomes.resolved + m.session_outcomes.escalated} finished sessions</div>
    </div>
    <div class="card">
      <div class="card-label">Total Sessions</div>
      <div class="card-value">${m.session_outcomes.total}</div>
      <div class="card-note">${m.session_outcomes.in_progress} in progress · ${m.session_outcomes.abandoned} abandoned</div>
    </div>
    <div class="card">
      <div class="card-label">Escalation Context Quality</div>
      <div class="card-value ${scoreClass(m.escalation_quality.context_completeness_rate)}">${pct(m.escalation_quality.context_completeness_rate)}</div>
      <div class="card-note">${m.escalation_quality.with_specific_reason} / ${m.escalation_quality.total_escalations} escalations carry a specific reason</div>
    </div>
  `;

  const breakdown = m.breakdown_by_request_type;
  const types = Object.keys(breakdown);
  document.getElementById("breakdown-table").innerHTML = types.length === 0
    ? `<div class="empty">No categorized sessions yet — run a few conversations first.</div>`
    : `
    <table>
      <thead><tr><th>Request Type</th><th>Resolved</th><th>Escalated</th></tr></thead>
      <tbody>
        ${types.map(t => `
          <tr>
            <td>${t}</td>
            <td><span class="pill resolved">${breakdown[t].resolved || 0}</span></td>
            <td><span class="pill escalated">${breakdown[t].escalated || 0}</span></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  const audit = m.audit_completeness;
  document.getElementById("audit-cards").innerHTML = `
    <div class="card">
      <div class="card-label">Hash Chain Integrity</div>
      <div class="card-value ${audit.hash_chain_intact ? 'good' : 'bad'}">${audit.hash_chain_intact ? 'Intact' : 'BROKEN'}</div>
      <div class="card-note">${audit.broken_link_count} broken link(s) detected</div>
    </div>
    <div class="card">
      <div class="card-label">Session Event Completeness</div>
      <div class="card-value ${scoreClass(audit.session_event_completeness_rate)}">${pct(audit.session_event_completeness_rate)}</div>
      <div class="card-note">${audit.incomplete_session_ids.length} session(s) missing expected log events</div>
    </div>
  `;
}

loadMetrics();
setInterval(loadMetrics, 15000);
</script>

</body>
</html>
